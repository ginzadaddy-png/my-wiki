name: Update Quartz

on:
  push:
    branches:
      - main
  # 수동 실행. QUARTZ_TOKEN 만료 등으로 실패한 뒤 시크릿만 갱신했을 때는
  # push가 없어 자동 재시도가 걸리지 않으므로 Actions 탭에서 직접 돌린다.
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.QUARTZ_TOKEN }}
          repository: ginzadaddy-png/quartz
          ref: v4
          submodules: recursive

      - name: Update submodule
        run: |
          git submodule update --remote content
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add .
          git diff --staged --quiet || git commit -m "auto: my-wiki 업데이트"
          git push
